name: Polyteru Notifier

on:
  schedule:
    # 10분마다 자동 실행
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동 즉시 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요 라이브러리 설치
      run: |
        pip install requests beautifulsoup4

    - name: 스크립트 실행
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python main.py

    - name: 변경사항(last_post.txt) 자동 저장
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add last_post.txt
        git commit -m "Update last post" || exit 0
        git push
